# Builds installable apps on every push to main:
#   macOS:   a universal .dmg (Apple silicon and Intel)
#   Windows: an .exe installer (NSIS)
# Each run uploads them as workflow artifacts, and attaches them to a draft
# GitHub Release for the app's version (v<version> from tauri.conf.json),
# which you publish by hand when you're happy with it.
#
# The builds are not code-signed yet (see plan.md, Phase 10): macOS shows an
# "unidentified developer" warning (right-click > Open the first time) and
# Windows SmartScreen asks before running the installer.
name: Release builds

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles dmg
            artifact: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Windows
            os: windows-latest
            rust-targets: ""
            args: --bundles nsis
            artifact: src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-${{ matrix.name }}

      - run: npm ci

      - name: Build and attach to the draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Thabi Studio v__VERSION__
          releaseBody: |
            Installers built from ${{ github.sha }}.
            - macOS: Thabi.Studio_*_universal.dmg (Apple silicon and Intel)
            - Windows: Thabi.Studio_*_x64-setup.exe
            These builds are not code-signed yet. On macOS, right-click the app and choose Open the first time.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Keep the installer with this run
        uses: actions/upload-artifact@v4
        with:
          name: thabi-studio-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
