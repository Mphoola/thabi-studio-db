# Local databases for the driver integration tests. Credentials come from
# tests/integration/.env (created by scripts/integration-tests.sh, never
# committed). Ports are bound to 127.0.0.1 only.
name: thabi-studio-it

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: thabi
      POSTGRES_PASSWORD: ${THABI_IT_PASSWORD:?run scripts/integration-tests.sh}
      POSTGRES_DB: thabi_it
    ports: ["127.0.0.1:${THABI_IT_PG_PORT:-55432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thabi -d thabi_it"]
      interval: 2s
      retries: 30

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_USER: thabi
      MYSQL_PASSWORD: ${THABI_IT_PASSWORD:?run scripts/integration-tests.sh}
      MYSQL_ROOT_PASSWORD: ${THABI_IT_PASSWORD:?run scripts/integration-tests.sh}
      MYSQL_DATABASE: thabi_it
    ports: ["127.0.0.1:${THABI_IT_MYSQL_PORT:-53306}:3306"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uthabi -p$$MYSQL_PASSWORD --silent",
        ]
      interval: 3s
      retries: 40

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${THABI_IT_PASSWORD:?run scripts/integration-tests.sh}
    ports: ["127.0.0.1:${THABI_IT_MSSQL_PORT:-51433}:1433"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q ''SELECT 1'' || exit 1',
        ]
      interval: 5s
      retries: 40
      start_period: 20s

  sshd:
    build: ./sshd
    environment:
      SSH_PASSWORD: ${THABI_IT_PASSWORD:?run scripts/integration-tests.sh}
      AUTHORIZED_KEYS: ${THABI_IT_AUTHORIZED_KEYS:?run scripts/integration-tests.sh}
    ports: ["127.0.0.1:${THABI_IT_SSH_PORT:-52222}:22"]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 22"]
      interval: 2s
      retries: 30

  # A second bastion for the ProxyJump tests: it forwards on to the `sshd`
  # service by name, both being on this network, so nothing extra is exposed.
  sshd-jump:
    build: ./sshd
    environment:
      SSH_PASSWORD: ${THABI_IT_PASSWORD:?run scripts/integration-tests.sh}
      AUTHORIZED_KEYS: ${THABI_IT_AUTHORIZED_KEYS:?run scripts/integration-tests.sh}
    ports: ["127.0.0.1:${THABI_IT_SSH_JUMP_PORT:-52223}:22"]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 22"]
      interval: 2s
      retries: 30
