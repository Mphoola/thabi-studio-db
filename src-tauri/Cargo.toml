[package]
name = "thabi-studio"
version = "0.1.0"
description = "Local-first desktop client for MySQL, PostgreSQL and SQL Server"
authors = ["Promise Mphoola"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "thabi_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring-core = "1.0"
rusqlite = { version = "0.40", features = ["bundled"] }
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls-ring-native-roots",
  "mysql",
  "postgres",
] }
tiberius = { version = "0.13", default-features = false, features = [
  "tds80",
  "rustls",
  "chrono",
] }
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
tauri-plugin-dialog = "2"
russh = { version = "0.64", default-features = false, features = ["ring", "rsa", "flate2"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0", features = ["keychain"] }
