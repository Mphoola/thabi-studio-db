[package]
name = "thabi-studio"
version = "0.1.0"
description = "Local-first desktop client for MySQL, PostgreSQL and SQL Server on macOS, Windows and Linux"
authors = ["Promise Mphoola"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "thabi_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring-core = "1.0"
rusqlite = { version = "0.40", features = ["bundled"] }
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls-ring-native-roots",
  "mysql",
  "postgres",
] }
# Decoding a bound query's values, which arrive typed rather than as text (see
# docs/decisions/0030-bound-parameters.md). Each is a type a real schema has:
# NUMERIC without this loses digits, and a timestamp or uuid column cannot be
# read at all. These go on the driver crate, not the `sqlx` umbrella, whose
# features would pull in sqlx-sqlite — which links the same SQLite this app
# already has through rusqlite, and the two cannot coexist.
sqlx-postgres = { version = "0.9", default-features = false, features = [
  "bigdecimal",
  "chrono",
  "uuid",
  "json",
] }
tiberius = { version = "0.13", default-features = false, features = [
  "tds80",
  "rustls",
  "chrono",
] }
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
tauri-plugin-dialog = "2"
russh = { version = "0.64", default-features = false, features = ["ring", "rsa", "flate2"] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
des = "0.9"
aes = "0.9"
md-5 = "0.11"
base64 = "0.22"
cbc = { version = "0.2", features = ["alloc"] }
rust_xlsxwriter = { version = "0.99", default-features = false, features = ["constant_memory"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "1.1", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service-keyring-store = { version = "1.0", features = ["crypto-rust"] }
