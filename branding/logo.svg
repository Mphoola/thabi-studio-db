<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Thabi Studio. Named for Tabitha Mphoola.
    A "T" built from a database: the crossbar is a disc (a cylinder seen
    from above) and the stem a column of stacked records. The small spark
    above it is Tabitha's light.
  -->
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#7B73FF"/>
      <stop offset="0.5" stop-color="#5651D6"/>
      <stop offset="1" stop-color="#2B2784"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D9D6FF"/>
      <stop offset="0.5" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C9C5FA"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEEcFF"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>

  <!-- stem: three stacked records -->
  <path d="M436 380 V724 a76 22 0 0 0 152 0 V380 Z" fill="url(#side)"/>
  <path d="M436 498 a76 22 0 0 0 152 0" fill="none" stroke="#5651D6" stroke-opacity="0.35" stroke-width="8"/>
  <path d="M436 612 a76 22 0 0 0 152 0" fill="none" stroke="#5651D6" stroke-opacity="0.35" stroke-width="8"/>

  <!-- crossbar: a disc with depth -->
  <path d="M276 312 V352 a236 62 0 0 0 472 0 V312 Z" fill="url(#side)"/>
  <ellipse cx="512" cy="312" rx="236" ry="62" fill="url(#top)"/>
  <ellipse cx="512" cy="312" rx="150" ry="30" fill="#5651D6" fill-opacity="0.16"/>

  <!-- Tabitha's spark -->
  <path d="M770 168 C776 206 788 218 826 224 C788 230 776 242 770 280 C764 242 752 230 714 224 C752 218 764 206 770 168 Z" fill="#FFFFFF"/>
  <circle cx="830" cy="300" r="10" fill="#FFFFFF" fill-opacity="0.7"/>
</svg>
